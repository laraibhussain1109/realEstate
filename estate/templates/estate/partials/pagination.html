{% if page_obj.has_other_pages %}<nav class="pagination" aria-label="Page navigation">{% if page_obj.has_previous %}<a class="button button-outline" href="?q={{ request.GET.q|urlencode }}&area={{ request.GET.area|urlencode }}&project={{ request.GET.project|urlencode }}&category={{ request.GET.category|urlencode }}&page={{ page_obj.previous_page_number }}">← Previous</a>{% endif %}<span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="button button-outline" href="?q={{ request.GET.q|urlencode }}&area={{ request.GET.area|urlencode }}&project={{ request.GET.project|urlencode }}&category={{ request.GET.category|urlencode }}&page={{ page_obj.next_page_number }}">Next →</a>{% endif %}</nav>{% endif %}
