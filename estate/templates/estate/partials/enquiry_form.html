<form class="enquiry-form" action="/api/enquiries/" method="post">{% csrf_token %}<input type="hidden" name="kind" value="site_visit"><input type="hidden" name="project" value="{{ project.slug|default:'' }}"><input type="hidden" name="plot" value=""><div class="form-row"><label>Your name <span>*</span><input name="name" autocomplete="name" required maxlength="120" placeholder="Full name"></label><label>Phone number <span>*</span><input name="phone" type="tel" autocomplete="tel" required maxlength="20" placeholder="+91"></label></div><label>Email address<input name="email" type="email" autocomplete="email" placeholder="you@example.com"></label><label class="visit-date">Preferred visit date<input name="visit_date" type="date"></label><label>How can we help?<textarea name="message" rows="3" placeholder="Tell us about the plot or location you’re interested in…" maxlength="4000"></textarea></label><div class="honeypot" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div><label class="checkbox-label"><input name="consent" type="checkbox" value="true" required><span>I agree to be contacted about my enquiry and accept the <a href="/pages/privacy/">privacy policy</a>.</span></label><div class="form-feedback" role="status" aria-live="polite"></div><button class="button" type="submit">Send request <span><svg class="arrow-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg></span></button><small class="form-note">An enquiry does not reserve a plot. Availability is confirmed by our team.</small></form>
