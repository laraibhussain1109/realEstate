{% load static cms %}
{% if gallery_images %}<section class="section gallery-section"><div class="container"><div class="section-heading"><div><span class="eyebrow"><i></i> A CLOSER LOOK</span><h2>{{ section.title|editorial_title }}</h2><p class="section-description">{{ section.body }}</p></div><a class="text-link" href="/gallery/">Visit the gallery <svg class="arrow-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg></a></div><div class="gallery-preview">{% for image in gallery_images|slice:':3' %}<button class="gallery-item" data-lightbox="{{ image.image.url }}" data-caption="{{ image.caption }}"><img src="{{ image.image.url }}" alt="{{ image.alt_text|default:image.caption }}" loading="lazy"><span>{{ image.caption }} <i><svg class="arrow-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg></i></span></button>{% endfor %}</div></div></section>{% endif %}
